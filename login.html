<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InvestWise - Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --purple: #8b5cf6;
            --purple-light: #a78bfa;
            --blue: #6366f1;
            --text: #f8fafc;
            --muted: #9ca5bd;
        }

        body {

            min-height: 100vh;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

            color: var(--text);

            background:

                radial-gradient(
                    circle at 15% 15%,
                    rgba(124, 58, 237, .22),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 85% 80%,
                    rgba(79, 70, 229, .18),
                    transparent 30%
                ),

                linear-gradient(
                    135deg,
                    #050711,
                    #090c18 50%,
                    #070914
                );

            padding: 25px;
        }


        /* BACKGROUND */

        .orb {

            position: fixed;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(80px);

            opacity: .18;
        }

        .orb-one {

            width: 220px;
            height: 220px;

            background: #7c3aed;

            top: -90px;
            left: -70px;
        }

        .orb-two {

            width: 260px;
            height: 260px;

            background: #4f46e5;

            bottom: -120px;
            right: -90px;
        }


        /* LOGIN CONTAINER */

        .login-container {

            width: 100%;

            max-width: 440px;

            position: relative;

            z-index: 2;
        }


        /* LOGO */

        .logo-section {

            text-align: center;

            margin-bottom: 24px;
        }

        .logo {

            width: 58px;
            height: 58px;

            margin: 0 auto 13px;

            border-radius: 17px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 27px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );

            box-shadow:
                0 14px 38px
                rgba(124, 58, 237, .35);
        }

        .logo-section h1 {

            font-size: 29px;

            font-weight: 850;

            letter-spacing: -.8px;
        }

        .logo-section p {

            margin-top: 6px;

            color: var(--muted);

            font-size: 12px;
        }


        /* CARD */

        .login-card {

            padding: 32px;

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(18, 22, 40, .96),
                    rgba(10, 13, 26, .96)
                );

            border:
                1px solid
                rgba(139, 92, 246, .20);

            box-shadow:
                0 30px 80px
                rgba(0, 0, 0, .45);

            backdrop-filter: blur(20px);
        }

        .card-heading {

            margin-bottom: 25px;
        }

        .card-heading h2 {

            font-size: 20px;

            margin-bottom: 6px;
        }

        .card-heading p {

            color: var(--muted);

            font-size: 11px;
        }


        /* FORM */

        .form-group {

            margin-bottom: 18px;
        }

        .form-group label {

            display: block;

            color: #dce1ef;

            font-size: 11px;

            font-weight: 750;

            margin-bottom: 7px;
        }

        .input-wrapper {

            position: relative;
        }

        .input-icon {

            position: absolute;

            left: 14px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 15px;

            opacity: .75;
        }

        .form-group input {

            width: 100%;

            height: 49px;

            padding:
                0 14px 0 42px;

            outline: none;

            border-radius: 12px;

            border:
                1px solid
                rgba(139, 92, 246, .16);

            background:
                rgba(5, 8, 18, .72);

            color: white;

            font-size: 13px;

            transition: all .2s ease;
        }

        .form-group input::placeholder {

            color: #555e78;
        }

        .form-group input:focus {

            border-color:
                var(--purple);

            box-shadow:
                0 0 0 4px
                rgba(139, 92, 246, .10);
        }


        /* LOGIN BUTTON */

        .login-btn {

            width: 100%;

            height: 49px;

            border: none;

            border-radius: 12px;

            color: white;

            cursor: pointer;

            font-size: 13px;

            font-weight: 800;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #4f46e5
                );

            box-shadow:
                0 12px 30px
                rgba(109, 40, 217, .28);

            transition: all .22s ease;

            margin-top: 5px;
        }

        .login-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 16px 35px
                rgba(109, 40, 217, .40);
        }

        .login-btn:active {

            transform:
                translateY(0);
        }


        /* DIVIDER */

        .divider {

            display: flex;

            align-items: center;

            gap: 12px;

            margin: 23px 0;

            color: #5f6780;

            font-size: 10px;
        }

        .divider::before,
        .divider::after {

            content: "";

            flex: 1;

            height: 1px;

            background:
                rgba(255,255,255,.07);
        }


        /* REGISTER */

        .register-text {

            text-align: center;

            color: var(--muted);

            font-size: 11px;
        }

        .register-text a {

            color: var(--purple-light);

            text-decoration: none;

            font-weight: 800;
        }

        .register-text a:hover {

            color: white;
        }


        /* SECURITY */

        .security {

            display: flex;

            justify-content: center;

            gap: 7px;

            margin-top: 19px;

            color: #65708d;

            font-size: 9px;
        }


        /* RESPONSIVE */

        @media(max-width: 500px) {

            body {

                padding: 15px;
            }

            .login-card {

                padding: 25px 20px;
            }

            .logo-section h1 {

                font-size: 25px;
            }

        }

    </style>

</head>


<body>

    <div class="orb orb-one"></div>

    <div class="orb orb-two"></div>


    <main class="login-container">


        <!-- LOGO -->

        <div class="logo-section">

            <div class="logo">
                📈
            </div>

            <h1>
                InvestWise
            </h1>

            <p>
                AI-Powered Virtual Investment Platform
            </p>

        </div>


        <!-- LOGIN CARD -->

        <div class="login-card">


            <div class="card-heading">

                <h2>
                    Welcome Back 👋
                </h2>

                <p>
                    Sign in to continue your investment journey.
                </p>

            </div>


            <!-- LOGIN FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        EMAIL ADDRESS
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            ✉️
                        </span>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        PASSWORD
                    </label>

                    <div class="input-wrapper">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-btn"
                >

                    🔐 Sign In

                </button>


            </form>


            <!-- DIVIDER -->

            <div class="divider">
                OR
            </div>


            <!-- CREATE ACCOUNT -->

            <div class="register-text">

                Don't have an account?

                <a href="index.html">
                    Create Account
                </a>

            </div>


        </div>


        <!-- SECURITY -->

        <div class="security">

            🔒 Secure virtual investment environment
            •
            🎓 Educational use only

        </div>


    </main>


    <!-- LOGIN JAVASCRIPT -->

    <script src="js/config.js"></script>

    <script>

        const loginForm =
            document.getElementById("loginForm");


        loginForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();

                // Get entered values
                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;

                let users = [];
                try {
                    users = JSON.parse(localStorage.getItem("users")) || [];
                } catch (e) {}

                let savedUser = null;
                try {
                    savedUser = JSON.parse(localStorage.getItem("investWiseUser"));
                } catch (e) {}

                // Check if account exists
                if (!savedUser && (!users || users.length === 0)) {
                    alert(
                        "No account found. Please create an account first."
                    );
                    return;
                }

                // Check email and password against array or single saved user
                let matchedUser = users.find(u => u && u.email === email && u.password === password);
                if (!matchedUser && savedUser && savedUser.email === email && savedUser.password === password) {
                    matchedUser = savedUser;
                }

                if (matchedUser) {
                    // Save login status
                    localStorage.setItem("isLoggedIn", "true");

                    // Save currently logged-in user
                    localStorage.setItem("loggedInUser", JSON.stringify(matchedUser));
                    localStorage.setItem("investWiseUser", JSON.stringify(matchedUser));
                    if (typeof INVESTWISE !== "undefined") {
                        INVESTWISE.setUser(matchedUser);
                    }

                    // Go to dashboard
                    window.location.href = "dashboard.html";
                } else {
                    alert(
                        "Incorrect email or password."
                    );
                }

            }
        );

    </script>


</body>

</html>
