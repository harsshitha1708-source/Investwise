<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InvestWise - Create Account</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;

            background:
                radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.20), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(124, 58, 237, 0.18), transparent 30%),
                linear-gradient(135deg, #f5f0ff, #eee7ff, #faf8ff);

            overflow-x: hidden;
        }

        /* Background decorations */

        body::before {
            content: "";
            position: fixed;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(124, 58, 237, 0.08);
            top: -120px;
            left: -100px;
            z-index: -1;
        }

        body::after {
            content: "";
            position: fixed;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: rgba(168, 85, 247, 0.08);
            bottom: -150px;
            right: -100px;
            z-index: -1;
        }

        /* Main Card */

        .signup-card {
            width: 100%;
            max-width: 520px;

            background: rgba(255, 255, 255, 0.95);

            border: 1px solid rgba(124, 58, 237, 0.15);

            border-radius: 24px;

            padding: 40px 45px;

            box-shadow:
                0 25px 60px rgba(76, 29, 149, 0.15),
                0 8px 20px rgba(0, 0, 0, 0.06);

            position: relative;

            overflow: hidden;
        }

        /* Purple top line */

        .signup-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;

            background: linear-gradient(
                90deg,
                #6d28d9,
                #8b5cf6,
                #a855f7
            );
        }

        /* Logo */

        .logo {
            text-align: center;
            margin-bottom: 8px;
        }

        .logo h1 {
            font-size: 34px;
            font-weight: 800;

            background: linear-gradient(
                90deg,
                #5b21b6,
                #7c3aed,
                #a855f7
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tagline {
            text-align: center;

            color: #6b7280;

            font-size: 15px;

            margin-bottom: 28px;
        }

        /* Heading */

        .heading {
            text-align: center;

            color: #1f1633;

            font-size: 25px;

            margin-bottom: 25px;

            font-weight: 700;
        }

        .heading span {
            color: #7c3aed;
        }

        /* Form */

        form {
            width: 100%;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group input,
        .input-group select {
            width: 100%;

            height: 48px;

            padding: 0 15px;

            border: 1.5px solid #ddd6fe;

            border-radius: 10px;

            outline: none;

            background: #ffffff;

            color: #1f2937;

            font-size: 15px;

            transition: all 0.25s ease;
        }

        .input-group input::placeholder {
            color: #8b8b9a;
        }

        .input-group input:hover,
        .input-group select:hover {
            border-color: #a78bfa;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #7c3aed;

            box-shadow:
                0 0 0 3px rgba(124, 58, 237, 0.12);

            transform: translateY(-1px);
        }

        /* Select row */

        .select-row {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;

            margin-bottom: 17px;
        }

        .select-row select {
            height: 48px;

            padding: 0 12px;

            border: 1.5px solid #ddd6fe;

            border-radius: 10px;

            background: white;

            font-size: 14px;

            outline: none;

            cursor: pointer;

            transition: 0.25s;
        }

        .select-row select:focus {
            border-color: #7c3aed;

            box-shadow:
                0 0 0 3px rgba(124, 58, 237, 0.12);
        }

        /* Terms */

        .terms {
            display: flex;

            align-items: center;

            gap: 9px;

            margin: 18px 3px 25px;

            font-size: 14px;

            color: #4b5563;
        }

        .terms input {
            width: 18px;
            height: 18px;

            accent-color: #7c3aed;

            cursor: pointer;
        }

        .terms a {
            color: #6d28d9;

            font-weight: 600;

            text-decoration: none;
        }

        .terms a:hover {
            text-decoration: underline;
        }

        /* Create Account Button */

        .create-btn {
            width: 100%;

            height: 50px;

            border: none;

            border-radius: 11px;

            background: linear-gradient(
                135deg,
                #5b21b6,
                #7c3aed,
                #9333ea
            );

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(124, 58, 237, 0.30);

            transition: all 0.3s ease;
        }

        .create-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(124, 58, 237, 0.40);
        }

        .create-btn:active {
            transform: translateY(0);
        }

        /* Login */

        .login-text {
            text-align: center;

            margin-top: 23px;

            color: #55516a;

            font-size: 14px;
        }

        .login-text a {
            color: #6d28d9;

            font-weight: 700;

            text-decoration: none;

            margin-left: 3px;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        /* Small security text */

        .security {
            text-align: center;

            margin-top: 20px;

            color: #8b8798;

            font-size: 12px;
        }

        /* Responsive */

        @media (max-width: 600px) {

            body {
                padding: 20px 12px;
            }

            .signup-card {
                padding: 32px 22px;

                border-radius: 20px;
            }

            .logo h1 {
                font-size: 30px;
            }

            .heading {
                font-size: 22px;
            }

            .select-row {
                grid-template-columns: 1fr;
            }

            .terms {
                align-items: flex-start;

                line-height: 1.5;
            }
        }

        @media (max-width: 380px) {

            .signup-card {
                padding: 28px 17px;
            }

            .logo h1 {
                font-size: 27px;
            }

            .heading {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-card">

        <!-- Logo -->
        <div class="logo">
            <h1>InvestWise</h1>
        </div>

        <!-- Tagline -->
        <p class="tagline">
            Learn Investing Without Risk
        </p>

        <!-- Heading -->
        <h2 class="heading">
            Create Your <span>Account</span>
        </h2>

        <!-- Registration Form -->
        <form id="registerForm">

            <!-- Full Name -->
            <div class="input-group">
                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    required
                >
            </div>

            <!-- Email -->
            <div class="input-group">
                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >
            </div>

            <!-- Phone -->
            <div class="input-group">
                <input
                    type="tel"
                    id="phone"
                    placeholder="Phone Number"
                    required
                >
            </div>

            <!-- Password -->
            <div class="input-group">
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >
            </div>

            <!-- Confirm Password -->
            <div class="input-group">
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm Password"
                    required
                >
            </div>

            <!-- Investment Experience + Risk Preference -->
            <div class="select-row">

                <select id="experience" required>
                    <option value="">Investment Experience</option>
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Experienced">Experienced</option>
                </select>

                <select id="risk" required>
                    <option value="">Risk Preference</option>
                    <option value="Low">Low Risk</option>
                    <option value="Medium">Medium Risk</option>
                    <option value="High">High Risk</option>
                </select>

            </div>

            <!-- Terms -->
            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <label for="terms">
                    I agree to the
                    <a href="#">Terms & Conditions</a>
                </label>

            </div>

            <!-- Create Account -->
            <button
                type="submit"
                class="create-btn"
            >
                Create Account
            </button>

        </form>

        <!-- Login -->
        <p class="login-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <!-- Security -->
        <p class="security">
            🔒 Your information is securely protected
        </p>

    </div>

    <!-- Keep your existing JavaScript here -->
    <script src="js/script.js"></script>

</body>

</html>
